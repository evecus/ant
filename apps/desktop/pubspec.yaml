name: ant_desktop
description: ant GUI 桌面端（Flutter / Windows），单内核 ant。
publish_to: 'none'
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  tray_manager: ^0.5.2
  window_manager: ^0.4.3
  sqlite3_flutter_libs: ^0.5.24
  ant_core:
    path: ../../packages/core
  ant_engine:
    path: ../../packages/core_engine
  ui_kit:
    path: ../../packages/ui_kit
  ui_desktop:
    path: ../../packages/ui_desktop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 内置路由模式所需的 ant .ars 二进制规则集（随源码提交；ensureRuleFiles 兜底释放到 run/rules/ant/）
  assets:
    - assets/ruleset/ant/
    - assets/tray_running.png
    - assets/tray_stopped.png
    - assets/tray_running.ico
    - assets/tray_stopped.ico
