[package]
name = "ant"
version = "0.1.0"
edition = "2021"
description = "Minimal proxy (Linux/macOS/Windows) with Hysteria2/VLESS, YAML config (mihomo-style), binary .ars rulesets"
license = "MIT"
repository = "https://github.com/aazz77/ant"

[[bin]]
name = "ant"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# Features
#
# Default build is minimal: Hysteria2 + VLESS (+ direct / groups / DNS / rules).
# Extra outbound protocols and TUN are opt-in to keep the binary small.
#
#   cargo build --release
#   cargo build --release --features full
#   cargo build --release --features "tun,shadowsocks,vmess"
# ---------------------------------------------------------------------------
[features]
# Default: Hy2 + VLESS + protocols that reuse core deps (no extra crates).
# Heavy extras (WG/smoltcp, SS/VMess crypto, JLS, TUN, …) stay opt-in.
default = ["tuic", "socks", "trojan"]
# Convenience meta-feature: every optional protocol + TUN.
full = [
    "tuic",
    "anytls",
    "naive",
    "shadowquic",
    "vmess",
    "shadowsocks",
    "socks",
    "trojan",
    "wireguard",
    "tun",
]
tuic = []
anytls = ["dep:md-5"]
naive = ["dep:h2"]
shadowquic = ["dep:quinn-jls", "dep:webpki-roots-jls"]
vmess = ["dep:aes", "dep:crc32fast", "dep:sha3", "dep:md-5"]
shadowsocks = ["dep:sha1", "dep:blake3", "dep:aes", "dep:md-5"]
socks = []
trojan = []
wireguard = ["dep:boringtun", "dep:smoltcp"]
# TUN virtual NIC + OS route/redirect integration.
# Pulls platform-specific netlink / nftables only where available.
tun = ["dep:tun", "dep:nftables", "dep:rtnetlink", "dep:netlink-packet-route"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "net", "io"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = { version = "0.5", features = ["all"] }

http = "1.0"
# naive 出站：HTTP/2 CONNECT 隧道（feature = naive）
h2 = { version = "0.4", optional = true }
hyper = { version = "1.1", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client", "client-legacy", "http1", "http2"] }
tower = { version = "0.5", default-features = false }
tokio-stream = "0.1"
http-body-util = "0.1"

rustls = { version = "0.23.5", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
quinn = { version = "0.11.7", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }

# shadowquic 出站（feature = shadowquic）
quinn-jls = { version = "0.3.8", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
webpki-roots-jls = { package = "webpki-roots", version = "1", optional = true }

# binary ruleset (.ars) — same idea as reflex .rrs
fst = "0.4"

# AnyTLS / VMess / Shadowsocks（部分协议 feature 打开时启用）
md-5 = { version = "0.10", optional = true }

# AtomicU64 fallback for 32-bit targets without 64-bit atomics (e.g. mips32/musl);
# std AtomicU64 alias on everything else.
portable-atomic = { version = "1", features = ["fallback"] }
# HPKE (RFC 9180) for rustls client-side ECH — the ring provider ships no HPKE,
# so we provide one on the same pure-Rust crates as REALITY.
hkdf = "0.12"

redb = "2.4"

ipnet = "2.9"
once_cell = "1.19"
rand = "0.8"
hex = "0.4"
ring = "0.17"
regex = "1.10"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"

# REALITY TLS (self-implemented TLS 1.3, from reflex) — used by VLESS
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# VMess / Shadowsocks crypto extras（feature 门控）
aes = { version = "0.8", optional = true }
crc32fast = { version = "1.4", optional = true }
sha3 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
blake3 = { version = "1.8.7", default-features = false, optional = true }

# WireGuard（feature = wireguard）
boringtun = { version = "0.7", default-features = false, optional = true }
smoltcp = { version = "0.13", default-features = false, optional = true, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-tcp-cubic",
    "socket-udp",
] }

# TUN virtual NIC（feature = tun）
tun = { version = "0.8", features = ["async"], optional = true }

# Windows OS control plane (sing-tun equivalent): default-interface monitor,
# IP_UNICAST_IF binding, and WFP strict-route filters.
# Always needed on Windows for sockopt; TUN-specific WFP is cfg'd in source.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Rpc",
] }

# Linux/Android-only: transparent proxy inbounds (tproxy / redir) use netfilter
# sockopts via libc; etherparse is for raw-packet re-injection in tproxy.
# nftables is only for TUN auto-redirect (feature = tun).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
etherparse = "0.15"
nftables = { version = "0.6", optional = true }

# Linux-only OS control plane (sing-tun equivalent): routes/rules via netlink.
# Only needed when feature = tun.
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = { version = "0.14", optional = true }
netlink-packet-route = { version = "0.19", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
debug = false

# macOS TUN: ioctl address/MTU setup (sing-tun tun_darwin.go equivalent)
# libc also used by sockopt for IP_BOUND_IF regardless of TUN.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
