[package]
name = "ant"
version = "0.1.0"
edition = "2021"
description = "Minimal proxy (Linux/macOS/Windows) with Hysteria2/VLESS, YAML config (mihomo-style), binary .ars rulesets"
license = "MIT"
repository = "https://github.com/aazz77/ant"

[[bin]]
name = "ant"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "net", "io"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = { version = "0.5", features = ["all"] }

http = "1.0"
hyper = { version = "1.1", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client", "client-legacy", "http1", "http2"] }
tower = { version = "0.5", default-features = false }
tokio-stream = "0.1"
http-body-util = "0.1"

rustls = { version = "0.23.5", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
quinn = { version = "0.11.7", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }

# binary ruleset (.ars) — same idea as reflex .rrs
fst = "0.4"

# QUIC 出站（tuic / hysteria2）UDP 会话路由：分片锁，dispatch 路径无全局锁竞争

# AnyTLS 出站：认证 token = md5 系列（RustCrypto 纯 Rust，与 sha2 同族）
md-5 = "0.10"

# AtomicU64 fallback for 32-bit targets without 64-bit atomics (e.g. mips32/musl);
# std AtomicU64 alias on everything else.
portable-atomic = { version = "1", features = ["fallback"] }
# HPKE (RFC 9180) for rustls client-side ECH — the ring provider ships no HPKE,
# so we provide one on the same pure-Rust crates as REALITY.
hkdf = "0.12"

ipnet = "2.9"
once_cell = "1.19"
rand = "0.8"
hex = "0.4"
ring = "0.17"
regex = "1.10"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"

# REALITY TLS (self-implemented TLS 1.3, from reflex)
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# TUN virtual NIC (Linux + Windows via WinTun). async = AsyncDevice.
tun = { version = "0.8", features = ["async"] }

# Windows OS control plane (sing-tun equivalent): default-interface monitor,
# IP_UNICAST_IF binding, and WFP strict-route filters.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Rpc",
] }

# Linux/Android-only: transparent proxy inbounds (tproxy / redir) use netfilter
# sockopts via libc; etherparse is for raw-packet re-injection in tproxy.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
etherparse = "0.15"
nftables = "0.6"

# Linux-only OS control plane (sing-tun equivalent): routes/rules via netlink.
# rtnetlink 0.14 cannot compile on Android (AddressFamily::Bridge references
# AF_BRIDGE, absent from bionic libc); Android uses external-FD mode where
# auto-route is force-disabled and netlink is never needed.
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.14"
netlink-packet-route = "0.19"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
debug = false

# macOS TUN: ioctl address/MTU setup (sing-tun tun_darwin.go equivalent)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
