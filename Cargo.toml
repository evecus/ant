[package]
name = "ant"
version = "0.1.0"
edition = "2021"
description = "Minimal proxy (Linux/macOS/Windows) with Hysteria2/VLESS, YAML config (mihomo-style), binary .ars rulesets"
license = "MIT"
repository = "https://github.com/aazz77/ant"

[[bin]]
name = "ant"
path = "src/main.rs"

[features]
default = []
wireguard = ["dep:boringtun"]
ssh       = ["dep:russh", "dep:dirs", "dep:totp-rs"]
tailscale = ["dep:tailscale"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

brotli-decompressor = "4"
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "net", "io"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = { version = "0.5", features = ["all"] }
etherparse = "0.15"
http = "1.0"
h2 = "0.4"
hyper = { version = "1.1", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client", "client-legacy", "http1", "http2"] }
tower = { version = "0.5", default-features = false }
tokio-stream = "0.1"
http-body-util = "0.1"

rustls = { version = "0.23.5", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
quinn = { version = "0.11.7", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
quinn-jls = { version = "0.3.8", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
webpki-roots-jls = { package = "webpki-roots", version = "1" }
quinn-proto-jls = { version = "0.3.8", default-features = false }
fst = "0.4"
md-5 = "0.10"
portable-atomic = { version = "1", features = ["fallback"] }
hkdf = "0.12"

redb = "2.4"

ipnet = "2.9"
once_cell = "1.19"
rand = "0.8"
hex = "0.4"
ring = "0.17"
regex = "1.10"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes = "0.8"
crc32fast = "1.4"
sha3 = "0.10"
sha1 = "0.10"
blake3 = { version = "1.8.7", default-features = false }
boringtun = { version = "0.7", default-features = false, optional = true }
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-tcp-cubic",
    "socket-udp",
] }
russh   = { version = "0.51", default-features = false, features = ["async-trait"], optional = true }
dirs    = { version = "5", optional = true }
totp-rs = { version = "5", optional = true }
tailscale = { version = "0.3", optional = true }
tun = { version = "0.8", features = ["async"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Rpc",
] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
nftables = "0.6"
rtnetlink = { package = "rtnetlink-android", version = "0.16.1" }
netlink-packet-route = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"