[package]
name = "ant-ebpf"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
aya-ebpf = "0.2"
aya-ebpf-bindings = "0.2"
aya-ebpf-cty = "0.3"
ant-ebpf-common = { path = "../common" }
network-types = "0.2.0"

[features]
default = []
log = []

[[bin]]
name = "ant-ebpf"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 2
