# Shared types between the ant userspace (src/ebpf) and the eBPF datapath
# (src/ebpf/program). Both sides must agree on struct layouts and map keys.
#
# This crate is no_std so the BPF side can depend on it directly; the aya
# (userspace) dependency is excluded from BPF-target builds.

[package]
name = "ant-ebpf-common"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
aya-ebpf-bindings = "0.2"
network-types = "0.2"

# aya is userspace-only; exclude it from BPF target builds.
[target.'cfg(not(target_arch = "bpf"))'.dependencies]
aya = "0.14"
