name: Build Linux x64
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-x64:
    name: linux-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x86_64-unknown-linux-musl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-unknown-linux-musl-cargo-

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release (x86_64)
        run: cross build --release --target x86_64-unknown-linux-musl --locked
      
      - run: |
        mkdir -p dist
        cp target/x86_64-unknown-linux-musl/release/ant dist/ant-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bin
          prerelease: false
          files: dist/ant-*
