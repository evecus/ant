name: Clippy

on:
  workflow_dispatch:

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-x86_64-clippy

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
