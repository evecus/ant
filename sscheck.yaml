log-level: info
mixed-port: 17989
mark: 255
proxies:
  - name: ss-tcp
    type: shadowsocks
    server: 127.0.0.1
    port: 8388
    cipher: aes-256-gcm
    password: pw
  - name: ss-ws
    type: ss
    server: 127.0.0.1
    port: 443
    cipher: 2022-blake3-aes-128-gcm
    password: AAAAAAAAAAAAAAAAAAAAAA==
    network: ws
    sni: example.com
    ws-path: /p
  - name: ss-xhttp
    type: ss
    server: 127.0.0.1
    port: 443
    method: chacha20-ietf-poly1305
    password: pw
    network: xhttp
    sni: example.com
    xhttp-mode: stream-one
    client-fingerprint: chrome
proxy-groups:
  - name: PROXY
    type: select
    proxies: [ss-tcp, ss-ws, ss-xhttp, DIRECT]
route:
  - MATCH,PROXY
