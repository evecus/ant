# ant example config — mihomo-style YAML; rulesets must be binary `.ars`
# Convert: ant ruleset-convert -i in.json -o out.ars

log-level: info
# mark: 255
# bind-address: "::"  # :: | 0.0.0.0 | 127.0.0.1
# api: "0.0.0.0:9095"  # connection panel http://ip:9095/ui
tproxy-port: 7878
mixed-port: 7898
redir-port: 7892
# sniff: true  # sniff TLS SNI / HTTP Host / QUIC for domain routing (default off);
#              # DNS-query sniffing follows dns.route-hijack independently

dns:
  # rule-follow-route: true  # true (default): reuse the connection-routing `route:` for DNS
  #                          #   upstream selection — direct-routed domains resolve via
  #                          #   direct-nameserver, node-routed via proxy-nameserver (both required).
  #                          # false: DNS routes by its own `rules:` list below.
  #                          #   - no `rules:`        → `nameserver` is required (default upstream)
  #                          #   - with `rules:`      → `rules:` must end with `match,<upstream>`;
  #                          #                          `nameserver` becomes optional (fallback only)
  #                          #   direct/proxy-nameserver are unused in this mode.
  # nameserver: "https://223.5.5.5/dns-query"  # rule-follow-route=false: default / fallback upstream
  # rules:                   # rule-follow-route=false only; uppercase keywords; first hit wins, MATCH must be last
  #   - RULE-SET,ads,rcode://success   # only upstream DNS URLs or rcode://success (NOERROR empty answer)
  #   - RULE-SET,cn-domain,udp://223.5.5.5:53
  #   - MATCH,tls://8.8.8.8:853      # required as the final entry when `rules:` is set
  # route-hijack: true  # steal port 53 and sniffed DNS into this module
  # mode: redir-host | fakeip  (default redir-host)
  # fakeip-range: "198.18.0.0/15"
  # fakeip6-range: "fc00::/18"
  # fakeip-filter:                        # uppercase RULE-SET,<provider-name> entries
  #   - RULE-SET,cn-domain                # rule-provider names deciding fake-ip usage:
  #   - RULE-SET,google-domain            #   blacklist mode (default): matched stay real-IP, rest get fake-ip
  #                                       #   whitelist mode: only matched get fake-ip
  # fakeip-filter-mode: blacklist         # blacklist (default) | whitelist
  # ipv6: true   # false: only A / IPv4 fake-ip, no AAAA upstream
  # cache-size: 4096  # 0 disables; LRU eviction when full
  port: 5353
  # bare IP / host:port → UDP; or explicit scheme:
  #   udp://1.1.1.1:53
  #   tcp://1.1.1.1:53
  #   tls://1.1.1.1:853
  #   https://1.1.1.1/dns-query
  #   https://cloudflare-dns.com/dns-query
  default-nameserver: "223.5.5.5:53"
  direct-nameserver: "223.5.5.5:53"
  proxy-nameserver: "https://1.1.1.1/dns-query"
  # block domains use rcode://success automatically

# Multiple nodes under proxies:; each has a unique `name` referenced by route:
# (RULE-SET,name,<outbound> or MATCH,<outbound>).
# Outbound keywords (reserved — a node may not be named after any of these):
#   DIRECT / direct          → bypass
#   BLOCK / block / REJECT / reject → reject (rcode://success in DNS)
# DNS: domains routed to any node resolve via proxy-nameserver, direct-routed via direct-nameserver.

proxies:
  - name: hy2-main
    type: hysteria2
    server: example.com
    port: 443
    password: your-password
    sni: example.com
    alpn: [h3]
    skip-cert-verify: true
    # Optional bandwidth limits, e.g. "100 Mbps" or "auto". `up` enables a
    # Brutal-like BBR initial window; `down` is advertised to the server.
    # up: "100 Mbps"
    # down: "300 Mbps"

  - name: vless-ws
    type: vless
    server: 1.2.3.4
    port: 443
    uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    network: ws
    tls: true
    sni: example.com
    ws-path: /path
    ws-host: example.com
    # ws-headers:
    #   User-Agent: Mozilla/5.0
    skip-cert-verify: false

  # VLESS + REALITY (self-implemented TLS 1.3, ported from reflex).
  # Any non-empty `reality-public-key` enables REALITY and bypasses rustls.
  # `flow: xtls-rprx-vision` enables XTLS Vision padding + direct passthrough
  # (TCP only, requires tls/reality — the standard REALITY+Vision combo).
  - name: vless-reality
    type: vless
    server: 1.2.3.4
    port: 443
    uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    network: tcp
    tls: true
    sni: www.cloudflare.com                 # REALITY server_name / camouflage SNI
    flow: xtls-rprx-vision                  # XTLS Vision（仅 tcp + tls/reality）
    reality-public-key: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx   # server x25519 pub (base64url / hex)
    reality-short-id: "0123abcd"              # hex, 0~16 chars
    # alpn: [h2]                              # optional, forwarded to the REALITY ClientHello

  # VLESS + XHTTP.
  #   stream-one : 单条 POST 双向流（HTTP/1.1，支持 REALITY）。
  #   packet-up  : GET 长轮询下行 + 攒批分包 POST 上行（h2，Xray 默认）。
  #   stream-up  : GET 长轮询下行 + 单条流式 POST 上行（h2）。
  #   auto       : 默认 packet-up；REALITY 下自动选 stream-one。
  # 与 REALITY 组合：直接加 reality-public-key / reality-short-id（此时仅
  # 支持 stream-one，显式 packet-up/stream-up 会在启动时报错）。
  - name: vless-xhttp
    type: vless
    server: 1.2.3.4
    port: 443
    uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    network: xhttp
    tls: true
    sni: example.com
    client-fingerprint: chrome               # uTLS 浏览器指纹（可选）
    xhttp-path: /xhttp
    xhttp-host: example.com                   # Host header, defaults to SNI
    xhttp-mode: auto                          # auto | stream-one | packet-up | stream-up
    # xhttp-headers:
    #   User-Agent: Mozilla/5.0
    skip-cert-verify: false

  # VLESS + TLS + ECH (Encrypted Client Hello, RFC 9849/9460)。
  # 启用后 rustls 用 HPKE 把真实 SNI（inner）加密进 outer ClientHello，
  # outer SNI 使用 ECH 配置中的 public_name（如 cloudflare-ech.com），
  # 中间链路只能看到 public_name，看不到真实域名。
  #   ech-config / ech-config-path : 显式提供 PEM `ECH CONFIGS` 配置；
  #   都不提供时自动通过 DNS HTTPS RR（type 65）查询 `ech` 参数，
  #   upstream 依次尝试 proxy-nameserver → nameserver → default-nameserver
  #   （建议 proxy-nameserver 用加密上游，否则查询会明文暴露 inner SNI）。
  # 仅 rustls TLS 路径支持：与 reality-public-key / client-fingerprint 互斥，
  # 组合会在启动时 fail-fast。非 443 端口按 RFC 9460 §9.1 用 _<port>._https 查询。
  - name: vless-ech
    type: vless
    server: 1.2.3.4
    port: 443
    uuid: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    network: tcp
    tls: true
    sni: example.com                          # inner SNI（真实域名，被 ECH 加密）
    ech: true                                 # 启用 ECH
    # ech-config-path: /etc/ant/ech.pem       # 可选：PEM ECH CONFIGS 文件
    # ech-query-server-name: example.com      # 可选：DNS 查询域名（默认 sni）
    skip-cert-verify: false

# Local rule providers only (type: file). behavior: domain | ip | ipcidr
rule-providers:
  ads:
    type: file
    behavior: domain
    path: /root/rules/ads.ars

  cn-domain:
    type: file
    behavior: domain
    path: /root/rules/cn-domain.ars

  cn-ip:
    type: file
    behavior: ip
    path: /root/rules/cn-ip.ars

# mihomo-style route rules (only RULE-SET and MATCH supported)
# Outbound: DIRECT/direct, BLOCK/block/REJECT/reject, or a proxies name
route:
  - RULE-SET,ads,REJECT
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,cn-ip,direct
  - MATCH,hy2-main
